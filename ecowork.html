<style>

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Nunito,system-ui,sans-serif;padding-bottom:76px}

.brand{font-weight:800;font-size:22px;display:flex;gap:8px;align-items:center}.brand i{font-style:normal;background:var(--l);border-radius:12px;width:34px;height:34px;display:grid;place-items:center;font-size:20px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}

.hero .btn{background:var(--l);color:#14301f}

.btn{background:var(--btn);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;min-height:46px;cursor:pointer}.btn.s{background:none;color:var(--g);border:2px solid var(--g);padding:6px 12px;min-height:36px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;min-height:44px}

.list>div{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.list>div:first-child{border-top:0}small,.mut{color:var(--mut)}

table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}th{border:0;color:var(--mut);font-size:13px}td input{min-height:36px;padding:6px;width:90px}
.wrap{overflow-x:auto}img.p{max-width:100%;border-radius:12px;margin-top:8px;max-height:200px}

@media(min-width:900px){body{padding:0 0 0 210px}header{margin-left:-210px;padding-left:226px}nav{top:0;bottom:auto;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:72px 10px 10px}nav button{flex:none;grid-template-columns:30px 1fr;justify-items:start;align-items:center;font-size:15px;padding:10px 12px}.grid{grid-template-columns:repeat(4,1fr)}}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.qr{display:grid;place-items:center;min-height:150px;margin-bottom:8px;background:#fff;padding:8px;border-radius:12px;color:#14301f}@media print{header,nav,.np,#toast{display:none!important}body{padding:0!important}}
.hr{display:flex;gap:8px;align-items:center}.ic{border:1px solid var(--line);background:var(--card);border-radius:999px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none}@media(max-width:420px){.seg button{padding:8px 9px;font-size:14px}.brand{font-size:19px}.brand i{display:none}}
</style></head><body>
<header><div class="brand"><i>♻</i>EcoWork</div><div class="hr"><button id="th" class="ic" onclick="toggleTheme()"></button><div class="seg"><button id="rf" onclick="setRole('func')">Funcionário</button><button id="rg" onclick="setRole('gest')">Gestão</button></div></div></header>
<main id="m"></main><nav id="n"></nav><div id="toast" hidden></div><div vw class="enabled"><div vw-access-button class="active"></div><div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R$=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),D=864e5,N=()=>Date.now();
const tm=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),dt=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const hh=ms=>{const m=Math.round(ms/6e4);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'min'};
const EPIS={'Capacete':24,'Luvas':3,'Óculos':12,'Botina':12,'Protetor auricular':6},ST=['Enviado','Em análise','Resolvido'],CS=['Aguardando','Em rota','Entregue'];
let S,role='func',page='home',me=1,who=1,draft=[],foto=null,pre={s:'',l:''};
function seed(){const bd=new Date();bd.setHours(8,0,0,0);const b=bd.getTime(),p=[];for(let e=1;e<=3;e++)for(let d=1;d<=4;d++)p.push({e,i:b-d*D+e*6e4*3,o:b-d*D+(8+e%2)*36e5});
return{setores:['Triagem','Prensa','Pátio','Administrativo'],emp:[{id:1,n:'Marcos Silva',s:'Triagem'},{id:2,n:'Júlia Alves',s:'Prensa'},{id:3,n:'Paulo Reis',s:'Pátio'},{id:4,n:'Ana Costa',s:'Administrativo'}],
precos:{'PET':2.8,'Papelão':.85,'Papel branco':.8,'Alumínio (lata)':6.5,'Vidro':.2,'Plástico duro':1.9,'Ferro':.6,'Cobre':38},
pontos:[{n:'Ponto Central',a:'Rua das Palmeiras, 120',h:'Seg a sáb, 7h–18h',m:'PET, papelão, vidro, metal',c:72},{n:'Ecoponto Bairro Norte',a:'Av. Brasil, 845',h:'Seg a sex, 8h–17h',m:'Papel, plástico, alumínio',c:35},{n:'Pátio da Cooperativa',a:'Estrada Velha, km 3',h:'Todos os dias, 6h–20h',m:'Todos os materiais',c:88},{n:'Escola Municipal',a:'Rua do Sol, 50',h:'Seg a sex, 7h–12h',m:'Papel, plástico',c:20}],
pesos:[{e:1,m:'PET',kg:42,t:N()-2*D},{e:1,m:'Papelão',kg:120,t:N()-D},{e:1,m:'Alumínio (lata)',kg:9.5,t:N()-D},{e:2,m:'Papel branco',kg:80,t:N()-D}],punches:p,
alertas:[{id:1,e:3,s:'Pátio',loc:'Esteira 2',d:'Fio exposto perto da esteira',v:'Alta',st:1,t:N()-D,f:null}],acid:[{id:1,tp:'Incidente',s:'Prensa',d:'Luva quase presa na entrada da prensa',t:N()-5*D}],
ent:[{e:1,p:'Capacete',t:N()-500*D},{e:1,p:'Óculos',t:N()-30*D},{e:1,p:'Botina',t:N()-100*D},{e:1,p:'Protetor auricular',t:N()-170*D},...Object.keys(EPIS).map(p=>({e:2,p,t:N()-20*D})),{e:3,p:'Capacete',t:N()-60*D},{e:3,p:'Botina',t:N()-60*D}],
cargas:[{id:1,e:3,o:'Ponto Central',d:'Cooperativa Verde Vale',min:50,h:'14:30',st:0,it:[{m:'PET',kg:320},{m:'Papelão',kg:540},{m:'Alumínio (lata)',kg:60}]}]}}
function load(){try{S=JSON.parse(localStorage.getItem('ecowork1'))}catch(e){}if(!S)S=seed();if(S.v!==3){S.v=3;S.precos={...DEF};const f=m=>OLD[m]||m;S.pesos.forEach(p=>p.m=f(p.m));S.cargas.forEach(c=>c.it.forEach(i=>i.m=f(i.m)))}if(S.v===3){const o=S.precos,N7='Outros (7) – plástico misto',D7='Diversos (7) – plástico misto';S.precos={};Object.keys(DEF).forEach(k=>S.precos[k]=o[k]??(k==D7?o[N7]:undefined)??DEF[k]);S.v=4;S.pesos=S.pesos.filter(p=>p.m!=='Óleo de cozinha usado');S.pesos.forEach(p=>{if(p.m==N7)p.m=D7});S.cargas.forEach(c=>{c.it=c.it.filter(i=>i.m!=='Óleo de cozinha usado');c.it.forEach(i=>{if(i.m==N7)i.m=D7})})}Object.keys(DEF).forEach(k=>{if(!(k in S.precos))S.precos[k]=DEF[k]});if(!S.vendas){S.vendas=[];S.desp=[];S.marg=40;demo()}if(!S.locais)S.locais=[{s:'Pátio',l:'Esteira 2'},{s:'Prensa',l:'Entrada da prensa'}]}
function save(){try{localStorage.setItem('ecowork1',JSON.stringify(S))}catch(e){}}
const emp=id=>S.emp.find(e=>e.id==id)||{n:'—',s:''},open=e=>S.punches.find(p=>p.e==e&&!p.o);
const hrs=e=>S.punches.filter(p=>p.e==e&&p.i>N()-30*D).reduce((s,p)=>s+(p.o||N())-p.i,0);
const kgOf=e=>S.pesos.filter(p=>p.e==e).reduce((s,p)=>s+kq(p.m,p.kg),0),valOf=e=>S.pesos.filter(p=>p.e==e).reduce((s,p)=>s+p.kg*(S.precos[p.m]||0),0);
function epiSt(e,p){const l=S.ent.filter(x=>x.e==e&&x.p==p).sort((a,b)=>b.t-a.t)[0];if(!l)return['pendente','Pendente',0];if(l.d)return['danificado','Danificado',l.t];const x=l.t+EPIS[p]*30*D;return x<N()?['vencido','Vencido',x]:x-N()<30*D?['vencendo','Vence em breve',x]:['ok','Em dia',x]}
const needs=e=>emp(e).s!=='Administrativo',pend=e=>needs(e)?Object.keys(EPIS).filter(p=>epiSt(e,p)[0]!=='ok'):[];
const pendAll=()=>S.emp.reduce((s,e)=>s+pend(e.id).length,0);
const cv=c=>c.it.reduce((s,i)=>s+i.kg*(S.precos[i.m]||0),0),ck=c=>c.it.reduce((s,i)=>s+kq(i.m,i.kg),0);
function toast(t){const x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>x.hidden=true,2200)}
const PG=[['home','🏠','Início'],['ponto','⏱️','Ponto'],['mat','♻️','Reciclagem'],['pontos','⭐','Pontos'],['alertas','⚠️','Alertas'],['epis','🦺','Equipamentos'],['coleta','🚚','Coleta'],['amb','🌳','Meio ambiente'],['vendas','📈','Vendas'],['contas','🧾','Contas'],['seg','📊','Segurança','g'],['equipe','👥','Equipe','g'],['qr','📱','QR Codes','g']];
function setRole(r){role=r;if(r==='func'&&/seg|equipe|qr/.test(page))page='home';R()}
function go(p){page=p;R();scrollTo(0,0)}
function R(){paintTheme();$('#rf').className=role=='func'?'on':'';$('#rg').className=role=='gest'?'on':'';
$('#n').innerHTML=PG.filter(p=>!p[3]||role=='gest').map(p=>`<button class="${p[0]==page?'on':''}" onclick="go('${p[0]}')"><b>${p[1]}</b>${p[2]}</button>`).join('');
$('#m').innerHTML=({home:vHome,ponto:vPonto,mat:vMat,pontos:vPts,alertas:vAl,epis:vEpi,coleta:vCol,amb:vAmb,vendas:vVend,contas:vCon,seg:vSeg,equipe:vEq,qr:vQr})[page]();if(page=='qr')drawQR()}
const kp=(v,l)=>`<div class="k"><b>${v}</b><span>${l}</span></div>`;
function setorBars(){const c={};S.setores.forEach(s=>c[s]=0);S.alertas.forEach(a=>c[a.s]=(c[a.s]||0)+1);S.acid.forEach(a=>c[a.s]=(c[a.s]||0)+1);const mx=Math.max(1,...Object.values(c));
return Object.entries(c).map(([s,n])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${esc(s)}</span><b>${n} ocorrência${n==1?'':'s'}</b></div><div class="bar ${n==mx&&n>0?'hot':''}"><i style="width:${n/mx*100}%"></i></div></div>`).join('')}
function vHome(){if(role=='func'){const o=open(me),e=emp(me);return`<div class="hero"><h1>Olá, ${esc(e.n.split(' ')[0])}!</h1><p>${o?'Em turno desde '+tm(o.i)+'.':'Você está fora do turno.'}</p><button class="btn" onclick="punch(${me})">${o?'Encerrar turno':'Bater ponto'}</button></div>
<div class="grid">${kp(hh(hrs(me)),'Horas em 30 dias')}${kp(kgOf(me).toFixed(1)+' kg','Reciclado por você')}${kp(R$(valOf(me)),'A receber (estimado)')}${kp(pend(me).length,'Equipamentos pendentes')}</div>
<div class="card" style="margin-top:14px"><h2>Viu algo perigoso?</h2><p class="mut">Avise agora, antes que vire acidente. Leva menos de um minuto.</p><button class="btn" onclick="go('alertas')">Enviar alerta de risco</button></div><div class="card"><h2>Pontos verdes</h2><p class="mut">Você tem <b>${pts(me)}</b> pontos para trocar por prêmios.</p><button class="btn s" onclick="go('pontos')">Ver prêmios</button></div>`}
const ab=S.alertas.filter(a=>a.st<2).length;return`<h1>Painel de segurança</h1><div class="grid">${kp(ab,'Alertas em aberto')}${kp(S.acid.length,'Acidentes e incidentes')}${kp(pendAll(),'Equipamentos pendentes ou vencidos')}${kp(S.cargas.filter(c=>c.st<2).length,'Cargas a caminho')}</div>
<div class="card" style="margin-top:14px"><h2>Ocorrências por setor</h2>${setorBars()}</div>`}
function punch(e){const o=open(e);if(o)o.o=N();else S.punches.push({e,i:N(),o:0});save();toast(o?'Turno encerrado':'Ponto registrado às '+tm(N()));R()}
function vPonto(){const L=e=>S.punches.filter(p=>p.e==e).sort((a,b)=>b.i-a.i).slice(0,6);
if(role=='func'){const o=open(me);return`<h1>Meu ponto</h1><div class="card"><b style="font-size:26px">${hh(hrs(me))}</b> <span class="mut">nos últimos 30 dias</span><p>${o?'Em turno desde '+tm(o.i):'Fora do turno'}</p><button class="btn" onclick="punch(${me})">${o?'Encerrar turno':'Bater ponto'}</button></div>
<div class="card list"><h2>Últimos registros</h2>${L(me).map(p=>`<div><span>${dt(p.i)} · ${tm(p.i)} → ${p.o?tm(p.o):'em andamento'}</span><b>${hh((p.o||N())-p.i)}</b></div>`).join('')||'<small>Sem registros ainda.</small>'}<small>Registros da máquina de ponto entram aqui automaticamente.</small></div>`}
return`<h1>Ponto da equipe</h1><div class="card list">${S.emp.map(e=>`<div><span><b>${esc(e.n)}</b><br><small>${esc(e.s)} · ${open(e.id)?'em turno':'fora do turno'}</small></span><span><b>${hh(hrs(e.id))}</b> <button class="btn s" onclick="punch(${e.id})">${open(e.id)?'Encerrar':'Registrar'}</button></span></div>`).join('')}</div>`}
function vMat(){const w=role=='func'?me:who,mine=S.pesos.filter(p=>p.e==w).sort((a,b)=>b.t-a.t),by={};mine.forEach(p=>by[p.m]=(by[p.m]||0)+p.kg);const ks=Object.keys(S.precos);
return`<h1>Reciclagem</h1>${role=='gest'?`<label>Pessoa</label><select onchange="who=+this.value;R()">${S.emp.map(e=>`<option value="${e.id}" ${e.id==w?'selected':''}>${esc(e.n)}</option>`).join('')}</select>`:''}
<div class="hero" style="margin-top:12px"><p style="margin:0">Previsão a receber</p><h1 style="font-size:36px">${R$(valOf(w))}</h1><p style="margin:0">${kgOf(w).toFixed(1)} kg separados</p></div>
<div class="card"><h2>Registrar pesagem</h2><div class="row"><div><label>Material</label><select id="pm">${opts()}</select></div><div><label>Quantidade (kg ou litros)</label><input id="pk" type="number" step="0.1" min="0" inputmode="decimal"></div><button class="btn" onclick="regW(${w})">Registrar</button></div></div>
<div class="card"><h2>Tabela de preços (R$ por kg; óleo por litro)</h2><div class="wrap"><table><tr><th>Material</th><th>Preço</th><th>Seu peso</th><th>Valor</th></tr>${ks.map((k,i)=>(!i||grp(k)!=grp(ks[i-1])?`<tr><td colspan="4"><b>${grp(k)}</b></td></tr>`:'')+`<tr><td>${esc(k)}</td><td>${role=='gest'?`<input type="number" step="0.05" value="${S.precos[k]}" onchange="setP(${i},this.value)">`:R$(S.precos[k])}</td><td>${(by[k]||0).toFixed(1)} ${un(k)}</td><td><b>${R$((by[k]||0)*S.precos[k])}</b></td></tr>`).join('')}</table></div><small>Valores de referência. Confirme com os compradores de Montes Claros e atualize aqui.</small></div>
<div class="card list"><h2>Histórico de pesagens</h2>${mine.slice(0,8).map(p=>`<div><span>${esc(p.m)} <small>${dt(p.t)}</small></span><b>${p.kg} ${un(p.m)} · ${R$(p.kg*S.precos[p.m])}</b></div>`).join('')||'<small>Nenhuma pesagem ainda.</small>'}</div>`}
function regW(e){const k=parseFloat($('#pk').value);if(!(k>0))return toast('Informe o peso em kg');S.pesos.push({e,m:$('#pm').value,kg:k,t:N()});save();toast('Pesagem registrada');R()}
function setP(i,v){S.precos[Object.keys(S.precos)[i]]=Math.max(0,parseFloat(v)||0);save();toast('Preço atualizado');R()}
function pic(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,320/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);foto=c.toDataURL('image/jpeg',.6);$('#prev').src=foto;$('#prev').hidden=false};im.src=r.result};r.readAsDataURL(f)}
function vAl(){const l=S.alertas.filter(a=>role=='gest'||a.e==me).sort((a,b)=>b.t-a.t);
return`<h1>Alertas de risco</h1><div class="card"><h2>Reportar situação perigosa</h2><label>Foto (tire na hora ou escolha da galeria)</label><input type="file" accept="image/*" onchange="pic(this)"><img id="prev" class="p" hidden alt="Foto do risco">
